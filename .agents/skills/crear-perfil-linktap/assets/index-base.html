<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f6">
  <meta name="description" content="{{META_DESCRIPCION_HTML}}">
  <title>{{NOMBRE_HTML}} · LinkTap</title>
  <style>
    :root { color-scheme:light; --ink:#121212; --muted:#6b6b6b; --line:#e7e7e7; --bg:#f6f6f6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100svh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { width:min(100% - 32px,470px); min-height:100svh; margin:auto; display:flex; flex-direction:column; }
    header { padding:31px 1px 20px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .brand { color:inherit; text-decoration:none; font-size:18px; letter-spacing:-.07em; font-weight:850; }
    .brand b { display:inline-grid; place-items:center; background:var(--ink); color:white; width:27px; height:27px; border-radius:9px; font-size:13px; letter-spacing:-.07em; margin-right:8px; vertical-align:1px; }
    .tag { border:1px solid #d9d9d9; border-radius:40px; padding:7px 11px; font-size:10px; font-weight:750; letter-spacing:.12em; }
    main { flex:1; display:flex; align-items:center; padding:22px 0 48px; }
    .card { width:100%; background:white; border:1px solid var(--line); border-radius:29px; padding:48px 30px 30px; box-shadow:0 18px 45px rgba(0,0,0,.035); text-align:center; overflow:hidden; }
    .avatar { height:102px; width:102px; margin:0 auto 28px; border-radius:29px; display:grid; place-items:center; background:var(--ink); color:white; font-size:37px; font-weight:900; letter-spacing:-.13em; box-shadow:0 12px 29px rgba(0,0,0,.12); transform:rotate(-4deg); }
    .avatar span { transform:rotate(4deg); margin-left:-4px; }
    .eyebrow { font-size:10px; font-weight:800; letter-spacing:.18em; color:var(--muted); }
    h1 { margin:17px auto 10px; font-size:clamp(32px,8vw,43px); line-height:1.09; letter-spacing:-.065em; font-weight:840; overflow-wrap:anywhere; }
    .subtitle { font-size:16px; font-weight:680; margin:0; letter-spacing:-.035em; }
    .description { max-width:310px; margin:19px auto 34px; font-size:14px; line-height:1.65; color:var(--muted); }
    button { appearance:none; cursor:pointer; width:100%; border:0; background:var(--ink); color:white; padding:18px 16px; border-radius:14px; font-weight:750; font-size:14px; transition:transform .15s,background .15s; }
    button:active { transform:scale(.985); }
    button:focus-visible { outline:3px solid #8d8d8d; outline-offset:4px; }
    .micro { margin:16px 0 0; font-size:11px; color:#929292; }
    footer { padding:0 0 32px; font-size:11px; color:#999; text-align:center; letter-spacing:.025em; }
    @media(max-width:380px){ .card{padding:36px 22px 25px;} header{padding-top:24px;} }
    @media(prefers-reduced-motion:reduce){button{transition:none;}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="https://linktap.cl/" aria-label="LinkTap, inicio"><b>LT</b> LinkTap</a>
      <span class="tag">UN SOLO TAP</span>
    </header>
    <main>
      <article class="card" aria-label="Perfil digital">
        <div class="avatar" aria-hidden="true"><span>LT</span></div>
        <span class="eyebrow">PERFIL DIGITAL</span>
        <h1>{{NOMBRE_HTML}}</h1>
        <p class="subtitle">{{SUBTITULO_HTML}}</p>
        <p class="description">{{DESCRIPCION_HTML}}</p>
        <button id="share" type="button">Compartir perfil ↗</button>
        <p class="micro">Tu próxima conexión empieza aquí.</p>
      </article>
    </main>
    <footer>Una experiencia digital LinkTap</footer>
  </div>
  <script>
    (function(){
      const button = document.getElementById("share");
      button.addEventListener("click", async function(){
        const url = window.location.href;
        try {
          if (navigator.share) {
            await navigator.share({title:document.title,url:url});
            return;
          }
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(url);
          } else {
            const input = document.createElement("textarea");
            input.value = url;
            input.style.position = "fixed";
            input.style.opacity = "0";
            document.body.appendChild(input);
            input.select();
            const copied = document.execCommand("copy");
            input.remove();
            if (!copied) throw new Error("No se pudo copiar");
          }
          const old = button.textContent;
          button.textContent = "¡Enlace copiado!";
          setTimeout(function(){button.textContent = old;},2200);
        } catch (error) {
          if (error && error.name === "AbortError") return;
          button.textContent = "No se pudo compartir";
          setTimeout(function(){button.textContent="Compartir perfil ↗";},2200);
        }
      });
    })();
  </script>
</body>
</html>

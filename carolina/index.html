<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carolina Sitja | Perfil Digital</title>
  <meta name="description" content="Perfil digital de Carolina Sitja, Enfermera.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --lila: #a77bd4;
      --lila-claro: #eee5f7;
      --lila-muy-claro: #f8f4fc;
      --lila-oscuro: #79549f;
      --texto: #28242d;
      --gris: #77727d;
      --blanco: #ffffff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      color: var(--texto);
      background:
        radial-gradient(circle at 10% 5%, #eee3f8 0, transparent 30%),
        radial-gradient(circle at 90% 85%, #f0e7f8 0, transparent 28%),
        #ffffff;
      padding: 35px 18px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255,255,255,.94);
      border: 1px solid #eee8f3;
      border-radius: 32px;
      padding: 38px 25px 28px;
      box-shadow: 0 20px 60px rgba(93, 65, 120, .10);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: var(--lila-muy-claro);
      top: -100px;
      right: -80px;
    }

    .medical-symbol {
      position: absolute;
      top: 22px;
      right: 25px;
      width: 37px;
      height: 37px;
      border-radius: 12px;
      background: var(--lila-muy-claro);
      color: var(--lila);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 300;
      z-index: 2;
    }

    .photo-wrap {
      width: 128px;
      height: 128px;
      margin: 0 auto 20px;
      padding: 5px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--lila), #d8c0ee);
      box-shadow: 0 10px 30px rgba(129, 85, 169, .18);
      position: relative;
      z-index: 2;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 4px solid white;
      display: block;
    }

    .name {
      text-align: center;
      font-size: 29px;
      letter-spacing: -.8px;
      font-weight: 750;
      margin-bottom: 7px;
    }

    .profession {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      color: var(--lila-oscuro);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 13px;
    }

    .profession-dot {
      width: 7px;
      height: 7px;
      background: var(--lila);
      border-radius: 50%;
    }

    .description {
      max-width: 330px;
      margin: 0 auto 28px;
      text-align: center;
      color: var(--gris);
      font-size: 13px;
      line-height: 1.55;
    }

    .divider {
      width: 45px;
      height: 3px;
      background: var(--lila-claro);
      border-radius: 10px;
      margin: 0 auto 26px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link {
      min-height: 68px;
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--texto);
      padding: 10px 14px;
      background: var(--lila-muy-claro);
      border: 1px solid #eee5f5;
      border-radius: 19px;
      transition: .2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: #d9c5eb;
      background: #f4edf9;
    }

    .icon {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border-radius: 14px;
      background: white;
      color: var(--lila-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      margin-right: 14px;
      box-shadow: 0 3px 12px rgba(87, 60, 110, .06);
    }

    .link-info {
      flex: 1;
    }

    .link-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .link-text {
      font-size: 12px;
      color: #8d8493;
    }

    .arrow {
      color: #b39bc7;
      font-size: 23px;
      margin-left: 10px;
    }

    .whatsapp {
      background: var(--lila);
      color: white;
      border: none;
    }

    .whatsapp:hover {
      background: var(--lila-oscuro);
    }

    .whatsapp .icon {
      color: var(--lila-oscuro);
    }

    .whatsapp .link-text {
      color: rgba(255,255,255,.75);
    }

    .whatsapp .arrow {
      color: rgba(255,255,255,.75);
    }

    .contact-label {
      text-align: center;
      margin: 27px 0 12px;
      color: #a39ca8;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .phone {
      display: block;
      text-align: center;
      color: var(--lila-oscuro);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px 0 4px;
    }

    .created {
      color: #aaa4ae;
      font-size: 10px;
      margin-bottom: 7px;
    }

    .linktap {
      font-size: 16px;
      font-weight: 800;
      color: #1b1b1d;
    }

    .blue-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: #1457ff;
      border-radius: 50%;
      margin: 0 1px;
      transform: translateY(-8px);
    }

    .slogan {
      color: #aaa4ae;
      text-transform: uppercase;
      font-size: 8px;
      letter-spacing: 1.7px;
      margin-top: 5px;
    }

    @media (max-width: 480px) {
      body {
        padding: 22px 13px;
      }

      .card {
        padding: 34px 19px 25px;
        border-radius: 27px;
      }

      .photo-wrap {
        width: 116px;
        height: 116px;
      }

      .name {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="medical-symbol">+</div>

      <div class="photo-wrap">
        <img
          src="625009556_18554631418007754_5915933389927000696_n.jpg"
          alt="Carolina Sitja"
          class="profile-photo"
        >
      </div>

      <h1 class="name">Carolina Sitja</h1>

      <div class="profession">
        <span class="profession-dot"></span>
        Enfermera
      </div>

      <p class="description">
        Perfil personal y contacto digital.
      </p>

      <div class="divider"></div>

      <div class="links">

        <!-- WHATSAPP -->

        <a
          href="https://wa.me/56972518601"
          target="_blank"
          rel="noopener noreferrer"
          class="link whatsapp"
        >
          <div class="icon">W</div>

          <div class="link-info">
            <div class="link-title">WhatsApp</div>
            <div class="link-text">Enviar un mensaje</div>
          </div>

          <div class="arrow">›</div>
        </a>


        <!-- INSTAGRAM -->

        <a
          href="https://www.instagram.com/carito_sitja/"
          target="_blank"
          rel="noopener noreferrer"
          class="link"
        >
          <div class="icon">◎</div>

          <div class="link-info">
            <div class="link-title">Instagram</div>
            <div class="link-text">@carito_sitja</div>
          </div>

          <div class="arrow">›</div>
        </a>


        <!-- FACEBOOK -->

        <a
          href="https://www.facebook.com/carito.sitja"
          target="_blank"
          rel="noopener noreferrer"
          class="link"
        >
          <div class="icon">f</div>

          <div class="link-info">
            <div class="link-title">Facebook</div>
            <div class="link-text">Carolina Sitja</div>
          </div>

          <div class="arrow">›</div>
        </a>

      </div>


      <div class="contact-label">
        Contacto
      </div>

      <a href="tel:+56972518601" class="phone">
        +56 9 7251 8601
      </a>

    </section>


    <footer>

      <div class="created">
        Perfil digital creado con
      </div>

      <div class="linktap">
        Link<span class="blue-dot"></span>Tap
      </div>

      <div class="slogan">
        Acerca y conecta
      </div>

    </footer>

  </main>

</body>
</html>

<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración | LinkTap</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#14213b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #e5eaf2;padding:18px max(20px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:23px;letter-spacing:-1px}header strong span{color:#176bff}main{max-width:1140px;margin:35px auto;padding:0 20px}h1{font-size:clamp(25px,4vw,34px);letter-spacing:-1px;margin:0 0 8px}p{color:#5c6a80}section,.panel{background:white;border:1px solid #e6ebf3;border-radius:18px;box-shadow:0 10px 35px #12264a09;padding:24px}.login{max-width:440px;margin:9vh auto}.login h1{font-size:27px}label{display:block;font-weight:650;font-size:14px;margin:18px 0 7px}input,select{width:100%;padding:12px 13px;border:1px solid #d5dfed;border-radius:10px;background:white;color:#14213b}input:focus,select:focus{outline:2px solid #9ec1ff;border-color:#176bff}button{background:#176bff;color:white;border:0;border-radius:10px;padding:12px 17px;font-weight:700}button.secondary{background:#eff4fd;color:#183c75}button:disabled{opacity:.55;cursor:wait}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:24px 0}.toolbar label{margin:0 0 6px}.toolbar select{min-width:190px}.toolbar>div{flex:1;max-width:260px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#718096;background:#f8faff}td,th{padding:14px 12px;border-bottom:1px solid #edf0f5}td{font-size:14px}tr:last-child td{border:0}.muted{color:#687991;font-size:13px}.pill{display:inline-block;background:#eef3fc;color:#28529b;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:650}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.actions{display:flex;gap:9px;align-items:center}.message{margin:14px 0;color:#b42318;font-size:14px;min-height:18px}.good{color:#087443}.detail{margin-top:20px}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detailgrid div{background:#f7f9fd;border-radius:10px;padding:13px;overflow-wrap:anywhere}.detailgrid b{display:block;font-size:12px;color:#607089;margin-bottom:5px}.detailgrid span{white-space:pre-wrap}.pager{margin-top:18px;display:flex;align-items:center;gap:12px;justify-content:flex-end}.hidden{display:none!important}@media(max-width:620px){header{padding:15px 20px}section,.panel{padding:18px}.detailgrid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.toolbar>div{max-width:none;flex-basis:100%}}
</style></head><body><header><strong>Link<span>Tap</span> <small style="font-size:12px;color:#8190a7;letter-spacing:0">ADMIN</small></strong><button id="logout" class="secondary hidden">Cerrar sesión</button></header><main>
<section id="loginPanel" class="login"><h1>Acceso privado</h1><p>Ingresa tu contraseña de administrador para revisar las solicitudes NFC.</p><form id="loginForm"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required minlength="16"><div style="margin-top:20px"><button id="loginButton" type="submit" style="width:100%">Ingresar al panel</button></div></form><div id="loginMessage" class="message" role="alert"></div></section>
<div id="dashboard" class="hidden"><div class="row"><div><h1>Solicitudes NFC</h1><p>Pedidos recibidos desde linktap.cl/solicitud · Horario de Chile</p></div><button class="secondary" id="refresh">Actualizar</button></div><div class="toolbar"><div><label for="filter">Filtrar por estado</label><select id="filter"><option value="">Todos los estados</option><option value="recibida">Recibida</option><option value="en_revision">En revisión</option><option value="confirmada">Confirmada</option><option value="en_produccion">En producción</option><option value="entregada">Entregada</option></select></div><span class="muted" id="count"></span></div><section><div class="tablewrap"><table><thead><tr><th>Solicitud</th><th>Cliente</th><th>Fecha Chile</th><th>Monto</th><th>Estado</th><th></th></tr></thead><tbody id="orders"></tbody></table></div><p id="empty" class="muted hidden">No hay solicitudes para mostrar.</p><div class="pager"><button class="secondary" id="prev">Anterior</button><span class="muted" id="pageLabel">Página 1</span><button class="secondary" id="next">Siguiente</button></div></section><div id="detail" class="panel detail hidden"><div class="row"><h2 id="detailTitle">Detalle</h2><button class="secondary" id="closeDetail">Cerrar</button></div><div id="detailGrid" class="detailgrid"></div><div class="toolbar"><div><label for="status">Actualizar estado</label><select id="status"><option value="recibida">Recibida</option><option value="en_revision">En revisión</option><option value="confirmada">Confirmada</option><option value="en_produccion">En producción</option><option value="entregada">Entregada</option></select></div><button id="saveStatus">Guardar estado</button></div><div id="detailMessage" class="message" role="status"></div></div><div id="dashboardMessage" class="message" role="alert"></div></div>
</main><script>
'use strict';
const API='https://linktap-nfc-staging.v-gomezsitja.workers.dev';
const $=id=>document.getElementById(id);
const labels={recibida:'Recibida',en_revision:'En revisión',confirmada:'Confirmada',en_produccion:'En producción',entregada:'Entregada'};
let token=null,page=1,total=0,orders=[],selected=null;
const fmtMoney=n=>n===null||n===undefined?'Por cotizar':new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);
function fmtDate(value){if(!value)return '—';const iso=value.includes('T')?value.replace(' ','T'):value.replace(' ','T')+'Z';const date=new Date(iso);return Number.isNaN(date.getTime())?'—':new Intl.DateTimeFormat('es-CL',{timeZone:'America/Santiago',dateStyle:'medium',timeStyle:'short'}).format(date);}
function showMessage(id,msg,good=false){$(id).textContent=msg;$(id).className='message'+(good?' good':'');}
function showLoggedIn(ok){$('loginPanel').classList.toggle('hidden',ok);$('dashboard').classList.toggle('hidden',!ok);$('logout').classList.toggle('hidden',!ok);if(!ok){$('password').value='';$('detail').classList.add('hidden');}}
async function api(path,options={}){const headers={'Content-Type':'application/json',...options.headers};if(token)headers.Authorization='Bearer '+token;const res=await fetch(API+path,{...options,headers,cache:'no-store'});let data;try{data=await res.json();}catch{throw Error('Respuesta inesperada del servidor');}if(!res.ok){if(res.status===401&&path!=='/api/admin/login'){token=null;showLoggedIn(false);}throw Error(data.error||'Error '+res.status);}return data;}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginButton').disabled=true;showMessage('loginMessage','');try{const result=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});token=result.token;$('password').value='';showLoggedIn(true);await loadOrders();}catch(err){showMessage('loginMessage',err.message);}finally{$('loginButton').disabled=false;}});
$('logout').addEventListener('click',()=>{token=null;orders=[];selected=null;showLoggedIn(false);});
function td(tr,value){const cell=document.createElement('td');cell.textContent=value;tr.append(cell);return cell;}
async function loadOrders(){showMessage('dashboardMessage','');$('orders').replaceChildren();try{const filter=$('filter').value;const data=await api('/api/admin/orders?page='+page+(filter?'&status='+encodeURIComponent(filter):''));orders=data.orders||[];total=data.total||0;$('count').textContent=total+' solicitudes';$('pageLabel').textContent='Página '+page;$('prev').disabled=page<=1;$('next').disabled=page*25>=total;$('empty').classList.toggle('hidden',orders.length>0);for(const order of orders){const tr=document.createElement('tr');td(tr,order.id);td(tr,order.customer_name);td(tr,fmtDate(order.created_at));td(tr,fmtMoney(order.total_clp));const state=td(tr,labels[order.status]||order.status);state.className='pill';const action=document.createElement('td');const btn=document.createElement('button');btn.className='secondary';btn.textContent='Ver detalle';btn.addEventListener('click',()=>showDetail(order));action.append(btn);tr.append(action);$('orders').append(tr);}}catch(err){showMessage('dashboardMessage',err.message);}}
function field(parent,label,value){const div=document.createElement('div'),b=document.createElement('b'),span=document.createElement('span');b.textContent=label;span.textContent=String(value??'—');div.append(b,span);parent.append(div);}
function showDetail(order){selected=order;$('detail').classList.remove('hidden');$('detailTitle').textContent='Solicitud '+order.id;$('detailGrid').replaceChildren();const grid=$('detailGrid');field(grid,'Cliente',order.customer_name);field(grid,'Correo',order.customer_email);field(grid,'Teléfono',order.customer_phone);field(grid,'Fecha Chile',fmtDate(order.created_at));field(grid,'Total',fmtMoney(order.total_clp));field(grid,'Destino NFC',order.destination);field(grid,'Observaciones',order.notes);field(grid,'Productos',(order.items||[]).map(item=>item.pack===0?`${item.quantity} × pedido personalizado de ${item.units} tarjetas`:`${item.quantity} × pack ${item.pack} tarjeta(s)`).join('\n'));$('status').value=order.status;showMessage('detailMessage','');$('detail').scrollIntoView({behavior:'smooth',block:'start'});}
$('saveStatus').addEventListener('click',async()=>{if(!selected)return;const btn=$('saveStatus');btn.disabled=true;showMessage('detailMessage','');try{const newStatus=$('status').value;await api('/api/admin/orders/'+encodeURIComponent(selected.id),{method:'PATCH',body:JSON.stringify({status:newStatus})});selected.status=newStatus;showMessage('detailMessage','Estado actualizado correctamente.',true);await loadOrders();}catch(err){showMessage('detailMessage',err.message);}finally{btn.disabled=false;}});
$('closeDetail').addEventListener('click',()=>$('detail').classList.add('hidden'));
$('filter').addEventListener('change',()=>{page=1;$('detail').classList.add('hidden');loadOrders();});
$('refresh').addEventListener('click',loadOrders);
$('prev').addEventListener('click',()=>{if(page>1){page--;loadOrders();}});
$('next').addEventListener('click',()=>{if(page*25<total){page++;loadOrders();}});
</script></body></html>

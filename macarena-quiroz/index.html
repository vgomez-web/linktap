<!doctype html>

<head>

<title>Macarena Quiroz | Perfil en construcción · LinkTap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--text:#f5f8ff;--muted:#a6b8d3;--blue:#5da4ff}
*{box-sizing:border-box}
html{min-height:100%;background:#08142b}
body{margin:0;min-height:100svh;display:grid;place-items:center;overflow-x:hidden;font-family:'DM Sans',Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 20% 0%,#184d9b65,transparent 48%),radial-gradient(ellipse at 95% 90%,#0b85e93d,transparent 45%),#08142b}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#0007,transparent)}
main{position:relative;width:min(100% - 34px,620px);padding:clamp(30px,7vw,65px);border:1px solid #ffffff28;border-radius:32px;background:linear-gradient(145deg,#ffffff18,#ffffff06);box-shadow:0 28px 90px #0006;backdrop-filter:blur(18px);text-align:center}
.mark{display:inline-flex;align-items:center;gap:10px;margin-bottom:43px;color:#fff;text-decoration:none;font-family:Manrope,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.06em}
.mark-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#2f8fff,#0f55d9);font-size:20px;letter-spacing:0}
.symbol{height:92px;width:92px;margin:0 auto 24px;border:1px solid #8ac2ff56;border-radius:27px;background:linear-gradient(145deg,#54a7ff33,#ffffff08);display:grid;place-items:center;box-shadow:inset 0 1px #ffffff40,0 16px 40px #0004}
.symbol svg{width:48px;height:48px;stroke:#acd5ff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.status{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid #79baff52;border-radius:999px;background:#5faaff17;color:#bedcff;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:#62b0ff;box-shadow:0 0 0 4px #62b0ff25}
h1{font:800 clamp(36px,9vw,60px)/1.06 Manrope,sans-serif;letter-spacing:-.065em;margin:23px 0 14px}
h2{font:700 clamp(19px,4.8vw,27px)/1.3 Manrope,sans-serif;margin:0 0 18px;color:#d4e8ff;letter-spacing:-.035em}
p{max-width:390px;margin:0 auto;color:var(--muted);font-size:15px;line-height:1.8}
.rule{width:65px;height:2px;border-radius:2px;margin:34px auto;background:linear-gradient(90deg,transparent,#7abaff,transparent)}
footer{font-size:12px;color:#93a9c7}footer strong{color:#e4efff}
@media(max-width:420px){main{padding:40px 24px;border-radius:26px}.mark{margin-bottom:36px}.symbol{width:80px;height:80px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-label="LinkTap"><span class="mark-icon" aria-hidden="true">↗</span>LinkTap</div>
  <div class="symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="7" y="10" width="34" height="28" rx="5"/><path d="M14 19h9M14 25h14M14 31h8"/><circle cx="33" cy="19" r="3"/></svg></div>
  <div class="status"><span class="dot"></span>Próximamente</div>
  <h1>Macarena<br>Quiroz</h1>
  <h2>Perfil digital en construcción</h2>
  <p>Estamos preparando un espacio para presentar su información y formas de contacto. Muy pronto podrás encontrar todo aquí, en un solo lugar.</p>
  <div class="rule"></div>
  <footer>Perfil digital impulsado por <strong>LinkTap</strong></footer>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LinkTap | Perfil Digital</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      padding: 30px 18px;
    }

    .perfil {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      text-align: center;
    }

    .logo {
      width: 95px;
      height: 95px;
      margin: 0 auto 18px;
      background: #111;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .descripcion {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .boton {
      display: flex;
      align-items: center;
      width: 100%;
      background: white;
      color: #111;
      text-decoration: none;
      padding: 18px 20px;
      margin-bottom: 12px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .boton:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .icono {
      width: 32px;
      margin-right: 14px;
      font-size: 21px;
    }

    .texto {
      flex: 1;
      text-align: left;
    }

    .flecha {
      color: #999;
    }

    .linktap {
      margin-top: 35px;
      font-size: 13px;
      color: #999;
    }

    .marca {
      color: #111;
      font-weight: bold;
    }

    .punto {
      color: #1687ff;
    }
  </style>
</head>

<body>

  <main class="perfil">

    <div class="logo">
      LT
    </div>

    <h1>Negocio de ejemplo</h1>

    <p class="descripcion">
      Encuentra todo lo que necesitas en un solo lugar.
    </p>

    <a class="boton" href="https://instagram.com" target="_blank">
      <span class="icono">◎</span>
      <span class="texto">Instagram</span>
      <span class="flecha">›</span>
    </a>

    <a class="boton" href="https://wa.me/56963074376" target="_blank">
      <span class="icono">◉</span>
      <span class="texto">WhatsApp</span>
      <span class="flecha">›</span>
    </a>

    <a class="boton" href="#" target="_blank">
      <span class="icono">★</span>
      <span class="texto">Déjanos una reseña</span>
      <span class="flecha">›</span>
    </a>

    <a class="boton" href="#" target="_blank">
      <span class="icono">☰</span>
      <span class="texto">Ver menú</span>
      <span class="flecha">›</span>
    </a>

    <a class="boton" href="#" target="_blank">
      <span class="icono">⌖</span>
      <span class="texto">Cómo llegar</span>
      <span class="flecha">›</span>
    </a>

    <a class="boton" href="#" target="_blank">
      <span class="icono">↗</span>
      <span class="texto">Sitio web</span>
      <span class="flecha">›</span>
    </a>

    <p class="linktap">
      Creado con <span class="marca">Link<span class="punto">T</span>ap</span>
      · Acerca y conecta
    </p>

  </main>

</body>
</html>
